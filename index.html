<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d2645;--paper:#fff4ec;--pink:#ff9ebb;--mint:#9fe3c3;--lav:#c9b6ff;--but:#ffe08a;--peach:#ffb38a}
*{box-sizing:border-box}
html{height:100%;background:radial-gradient(circle at 15% 0,#ffd9e6 0,transparent 40%),radial-gradient(circle at 95% 35%,#e3d9ff 0,transparent 35%),var(--paper)}
body{margin:auto;height:100%;max-width:480px;display:flex;flex-direction:column;font:500 16px/1.4 Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:var(--ink)}
button{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
input,select{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;min-width:0}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
header h1{margin:0;font-size:22px;flex:1}
#mascot{display:inline-block}
body.studying #mascot{animation:b 1s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-5px) rotate(8deg)}}
@media(prefers-reduced-motion){body.studying #mascot{animation:none}}
main{flex:1;overflow:auto;padding:8px 14px}
#timer{background:var(--but);border:2.5px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);text-align:center;padding:14px 8px 10px;margin:6px 0 14px}
#sess{font-size:54px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
#btns{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
#btns button{flex:1;padding:8px 2px}
#btns button.on{transform:translateY(3px);box-shadow:none;background:var(--c)}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:3px 11px;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--pink)}
.row{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:7px 10px;margin-bottom:8px}
.row.me{background:#ffe3ee}
.rk{width:18px;text-align:center;opacity:.6}
.av{width:42px;height:42px;border-radius:50%;border:4px solid;display:grid;place-items:center;font-size:22px;overflow:hidden;background:var(--paper);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.nm b,.nm small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{opacity:.7}
.t{font-variant-numeric:tabular-nums;font-weight:600}
.mini{padding:2px 6px;box-shadow:0 2px 0 var(--ink);font-size:14px}
.add{display:flex;gap:8px;margin:10px 0}
.add input{flex:1}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.pill{display:inline-block;background:var(--lav);border:2px solid var(--ink);border-radius:12px;padding:0 8px;margin:3px 3px 3px 0;font-size:14px}
.pill a{cursor:pointer;color:#c0264f}
.tag{background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:0 6px;font-size:13px;cursor:pointer}
.empty,#hint{opacity:.7;text-align:center;font-size:14px}
#banner{margin:0;padding:0 16px;color:#c0264f;text-align:center;min-height:0}
#msgs{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.m{max-width:80%;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:4px 10px;align-self:flex-start;overflow-wrap:anywhere}
.m.mine{align-self:flex-end;background:var(--pink)}
.m small{display:block;opacity:.65;font-size:12px}
nav{display:flex;gap:8px;padding:10px 14px 12px}
nav button{flex:1}
nav button.on{background:var(--pink)}
dialog{border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);background:var(--paper);color:var(--ink);width:min(92vw,420px);max-height:88vh}
dialog::backdrop{background:#3d264766}
dialog h3{margin:14px 0 6px}
dialog label{display:flex;align-items:center;gap:8px;margin:4px 0}
.danger{background:#ffc9d4}
.dot{display:inline-block;min-width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-left:4px;vertical-align:middle;font-size:9px;line-height:8px}.dot.r{background:#ff4d6d}.dot.b{background:#4d9bff}.dot.y{background:var(--but);padding:0 2px}
</style></head><body>
<header><h1>Study Buddy <span id="mascot">🍓</span></h1><b id="me"></b><button id="gear" aria-label="Settings">⚙️</button></header>
<main>
<section id="v-home">
 <div id="timer"><div id="sess">0:00:00</div><small id="stl">ready when you are</small></div>
 <div id="btns">
  <button data-s="studying" style="--c:var(--mint)">📖 Study</button>
  <button data-s="break" style="--c:var(--but)">🍵 Break</button>
  <button data-s="away" style="--c:var(--peach)">🌙 Away</button>
  <button data-s="idle" style="--c:var(--lav)">⏹ Stop</button>
 </div>
 <div id="reqs"></div><div id="chips"></div><div id="list"></div>
 <div class="add"><input id="fin" placeholder="Add a friend's name tag"><button id="fadd">Add</button></div>
 <p id="hint">Right-click or long-press someone to hide them.</p>
</section>
<section id="v-chat" hidden>
 <select id="csel" style="width:100%;margin-bottom:8px"></select>
 <div id="msgs"></div>
 <div class="add"><input id="cin" placeholder="Say something nice"><button id="csend">Send</button></div>
</section>
<section id="v-groups" hidden>
 <div class="add"><input id="gname" placeholder="New group name"><button id="gmk">Create</button></div>
 <div class="add"><input id="gtag" placeholder="Group tag to join"><button id="gjoin">Join</button></div>
 <div id="glist"></div>
</section>
</main>
<p id="banner"></p>
<nav><button data-v="home" class="on">🏠 Home<i class="dot y" id="dq" hidden></i></button><button data-v="chat">💬 Chat<i class="dot r" id="dr" hidden></i><i class="dot b" id="db" hidden></i></button><button data-v="groups">👭 Groups</button></nav>
<dialog id="dlg"></dialog>
<dialog id="nm"><h3>Welcome 🌸</h3><div class="add" style="margin:0 0 8px"><button id="tin" class="chip on">Log in</button><button id="tup" class="chip">Sign up</button></div><p id="nh" style="font-size:14px;margin:0 0 8px"></p><div style="display:grid;gap:8px"><input id="nin" maxlength="20" placeholder="Name tag" autocomplete="username"><input id="npw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><button id="nok">Let's go</button></div><p id="nmsg" style="color:#c0264f"></p></dialog>
<script>
const DB="https://rmdn-f2330-default-rtdb.firebaseio.com";
const $=s=>document.querySelector(s),NAME_RE=/^(?=.*[A-Za-z])[A-Za-z0-9_-]{2,20}$/;
const ST={studying:["Studying","#6fd6a3"],break:["On break","#ffd25e"],away:["Away","#ff9a6b"],idle:["Online","#b9a4ff"],offline:["Offline","#cfc3cf"]};
const EM=["🐰","🐱","🐻","🦊","🐼","🐸","🐥","🦄","🐙","🐹"];
const S={online:[660,880],offline:[520,390],start:[523,659,784],end:[784,659,523],click:[1000],msg:[880,1175]};
const SL={online:"Friend comes online",offline:"Friend goes offline",start:"Timer starts",end:"Timer ends",click:"Button click",msg:"New message / friend request"};
let cfg={};try{cfg=JSON.parse(localStorage.sb||"{}")}catch(e){}
cfg.uid??=crypto.randomUUID();cfg.friends??=[];cfg.blocked??=[];cfg.hidden??=[];cfg.sel??=[];cfg.dms??=[];cfg.snd??={on:true,vol:.5,off:[]};cfg.nt??={dots:true,pop:false};cfg.dev??=crypto.randomUUID();
const save=()=>{try{localStorage.sb=JSON.stringify(cfg)}catch(e){}};
let key=null,me={status:"idle",since:null,total:0},users={},groups={},off=0,hbl=0,seenLs=null,ready=false,started=false,prevOn={},lastSig="",chatSel="general",lastMsg="",wl=null,reqs={},prevReq=null,unr={},swept=0,busy=0,am="in",lastReq="";
const now=()=>Date.now()+off;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,s|0);return`${s/3600|0}:${String(s%3600/60|0).padStart(2,0)}:${String(s%60).padStart(2,0)}`};
const av=(u,k)=>u&&/^data:image\//.test(u.pic||"")?`<img src="${u.pic}" alt="">`:EM[[...k].reduce((a,c)=>a+c.charCodeAt(0),0)%EM.length];
async function api(m,p,b,q=""){const r=await fetch(`${DB}/${p}.json${q}`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()}
const banner=t=>$("#banner").textContent=t;
const onErr=e=>banner(/40[13]/.test(e.message)?"The database rules are blocking access. Check the Rules tab in Firebase.":"Can't reach the server. Retrying…");
let ac;function beep(k){if(!cfg.snd.on||cfg.snd.off.includes(k))return;try{ac??=new AudioContext();S[k].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.11;o.frequency.value=f;g.gain.setValueAtTime(cfg.snd.vol*.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.2)})}catch(e){}}

/* ---- people ---- */
const myG=()=>Object.entries(groups).filter(([t,g])=>g&&g.members&&g.members[key]&&!(g.banned&&g.banned[key])&&!(g.bandev&&g.bandev[cfg.dev]));
function entry(k){const n=now();let r,on,name;
 if(k===key){r=me;on=true;name=cfg.name}
 else{r=users[k];if(!r)return{k,name:k,st:"offline",total:0,miss:1};on=n-(r.last_seen||0)<45000;name=r.name||k}
 let st=r.status||"idle",total=r.total||0;
 if(st==="studying"&&r.since)total+=Math.max(0,((on?n:(r.last_seen||r.since))-r.since)/1000);
 return{k,name,st:on?st:"offline",total,u:users[k]}}
function shown(){const s=new Set(),sel=cfg.sel,all=!sel.length;
 if(all||sel.includes("f"))cfg.friends.forEach(k=>s.add(k));
 myG().forEach(([t,g])=>{if(all||sel.includes("g:"+t))Object.keys(g.members).forEach(k=>s.add(k))});
 s.delete(key);return[...s].filter(k=>!cfg.blocked.includes(k)&&!cfg.hidden.includes(k))}
function renderChips(){const sel=cfg.sel,c=(id,l)=>`<button class="chip${sel.includes(id)?" on":""}" data-chip="${id}">${l}</button>`;
 $("#chips").innerHTML=`<button class="chip${sel.length?"":" on"}" data-chip="all">All</button>`+c("f","💛 Friends")+`<button class="chip" data-chip="gonly">Groups only</button>`+myG().map(([t,g])=>c("g:"+t,"👭 "+esc(g.name))).join("")+(cfg.hidden.length?`<button class="chip" data-chip="unhide">👀 ${cfg.hidden.length} hidden</button>`:"")}
const notify=(t,b)=>{try{if(cfg.nt.pop&&document.hidden&&window.Notification&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}};
function renderReqs(){const ks=Object.keys(reqs).filter(k=>!cfg.blocked.includes(k)),h=ks.length?`<div class="card"><b>💌 Friend requests</b>${ks.map(k=>`<div class="row" style="margin:6px 0 0"><span class="nm"><b>${esc(users[k]?.name||k)}</b><small>wants to be friends</small></span><button class="mini" data-acc="${k}">✔ Accept</button><button class="mini" data-dec="${k}" aria-label="Decline">✖</button></div>`).join("")}</div>`:"";if(h!==lastReq){lastReq=h;$("#reqs").innerHTML=h}}
function updDots(){const k=Object.keys(unr).filter(x=>unr[x]),on=cfg.nt.dots,n=Object.keys(reqs).length;$("#dr").hidden=!(on&&k.some(x=>x[0]==="g"));$("#db").hidden=!(on&&k.some(x=>x[0]==="d"));$("#dq").hidden=!(on&&n);$("#dq").textContent=n}
function render(){if(!ready)return;renderChips();renderReqs();
 const es=[key,...shown()].map(entry).sort((a,b)=>b.total-a.total);
 const sig=JSON.stringify(es.map(e=>[e.k,e.st,(e.u?.pic||"").length,e.name,cfg.friends.includes(e.k)]));
 if(sig!==lastSig){lastSig=sig;$("#list").innerHTML=es.map((e,i)=>`<div class="row${e.k===key?" me":""}" data-k="${e.k}"><span class="rk">${i+1}</span><span class="av" style="border-color:${ST[e.st][1]}">${av(e.u,e.k)}</span><span class="nm"><b>${esc(e.name)}</b><small>${e.miss?"Not found yet":ST[e.st][0]}</small></span><span class="t"></span>${e.k===key?"":`${cfg.friends.includes(e.k)?`<button class="mini" data-dm="${e.k}" aria-label="Message">💬</button>`:`<button class="mini" data-rq="${e.k}" aria-label="Send friend request">➕</button>`}<button class="mini" data-blk="${e.k}" aria-label="Ban">🚫</button>`}</div>`).join("")}
 es.forEach(e=>{const el=$(`.row[data-k="${e.k}"] .t`);if(el)el.textContent=fmt(e.total)})}
function sounds(){shown().forEach(k=>{const on=entry(k).st!=="offline";if(k in prevOn&&prevOn[k]!==on)beep(on?"online":"offline");prevOn[k]=on})}

/* ---- network loops ---- */
const push=()=>{if(!ready)return;hbl=Date.now();api("PATCH","users/"+key,{name:cfg.name,uid:cfg.uid,status:me.status,since:me.since,total:Math.floor(me.total),last_seen:{".sv":"timestamp"}}).catch(onErr)};
async function poll(){if(!ready)return;try{const[u,g,rq,fr]=await Promise.all([api("GET","users"),api("GET","groups"),api("GET","requests/"+key),api("GET","friends/"+key)]);users=u||{};groups=g||{};reqs=rq||{};
 const fk=Object.keys(fr||{}),leg=cfg.friends;if(!cfg.mig){cfg.mig=1;leg.filter(k=>!fk.includes(k)).forEach(k=>sendReq(k).catch(()=>0))}cfg.friends=fk;save();
 const ls=users[key]?.last_seen;if(ls&&hbl&&ls!==seenLs){off=ls-hbl;seenLs=ls}banner("");
 const rk=Object.keys(reqs);if(prevReq&&rk.some(k=>!prevReq.includes(k))){beep("msg");notify("Friend request","Someone wants to be your study buddy")}prevReq=rk;
 if(!swept){swept=1;Object.entries(users).filter(([k,x])=>k!==key&&expired(x)).slice(0,5).forEach(([k])=>purge(k))}
 sounds();render();updDots();if(!$("#v-groups").hidden)renderGroups()}catch(e){onErr(e)}}
async function sendReq(k){if(reqs[k])return accept(k);await api("PUT",`requests/${k}/${key}`,{t:{".sv":"timestamp"}})}
async function accept(k){await Promise.all([api("PUT",`friends/${key}/${k}`,true),api("PUT",`friends/${k}/${key}`,true),api("DELETE",`requests/${key}/${k}`)])}
async function checkUnread(){if(!ready||busy)return;busy=1;try{const base=!cfg.seen;cfg.seen??={};
 const L=[...myG().map(([t])=>"g_"+t),...cfg.friends.filter(k=>!cfg.blocked.includes(k)).map(k=>"dm:"+k)];
 await Promise.all(L.map(async id=>{try{const m=await api("GET",cpath(id),undefined,'?orderBy=%22$key%22&limitToLast=1')||{},i=Object.keys(m)[0];if(!i)return;const f=m[i].from,skip=f===key||cfg.blocked.includes(f)||base||(chatSel===id&&!$("#v-chat").hidden&&!document.hidden);
  if(skip||cfg.seen[id]>=i){if(!(cfg.seen[id]>=i))cfg.seen[id]=i;unr[id]=0;return}
  if(unr[id]!==i){beep("msg");notify("New message",id[0]==="g"?"In "+(groups[id.slice(2)]?.name||"a group"):"From "+(users[id.slice(3)]?.name||"a friend"))}unr[id]=i}catch(e){}}));
 save();updDots()}finally{busy=0}}
function start(){if(started)return;started=true;setInterval(poll,5000);setInterval(push,15000);setInterval(loadChat,3000);setInterval(checkUnread,7000);checkUnread()}
const AD=90*864e5,expired=r=>!!(r&&r.last_seen&&now()-r.last_seen>AD);
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,0)).join("");
async function hp(pw,salt){const e=new TextEncoder(),k=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveBits"]);return hx(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:e.encode(salt),iterations:100000},k,256))}
async function purge(k){try{const[g,f]=await Promise.all([api("GET","groups"),api("GET","friends/"+k)]);await Promise.all([api("DELETE","users/"+k),api("DELETE","friends/"+k),api("DELETE","requests/"+k),...Object.keys(f||{}).map(o=>api("DELETE",`friends/${o}/${k}`)),...Object.entries(g||{}).filter(([t,x])=>x&&x.members&&x.members[k]).map(([t])=>api("DELETE",`groups/${t}/members/${k}`))])}catch(e){}}
async function migrate(o,n){const f=Object.keys(await api("GET","friends/"+o)||{});await Promise.all([...Object.entries(groups).filter(([t,g])=>g&&g.members&&g.members[o]).flatMap(([t,g])=>[api("PATCH",`groups/${t}/members`,{[n]:true}),api("DELETE",`groups/${t}/members/${o}`),...(g.owner===o?[api("PATCH","groups/"+t,{owner:n})]:[])]),...f.flatMap(x=>[api("PUT",`friends/${x}/${n}`,true),api("DELETE",`friends/${x}/${o}`),api("PUT",`friends/${n}/${x}`,true)]),api("DELETE","friends/"+o),api("DELETE","requests/"+o)]);await api("DELETE","users/"+o)}
function enter(k,name,r){key=k;cfg.name=name;save();let t=r.total||0;if(r.status==="studying"&&r.since&&r.last_seen)t+=Math.max(0,(r.last_seen-r.since)/1000);me={status:"idle",since:null,total:Math.floor(t)};ready=true;$("#me").textContent=name;hl();push();poll();start();return"ok"}
async function claim(name,pw,mode){const k=name.toLowerCase(),old=key;try{let r=await api("GET","users/"+k);
 if(r&&expired(r)&&r.uid!==cfg.uid){await purge(k);r=null}
 if(mode==="in"){if(!r||!r.ph)return"nouser";if(await hp(pw,r.salt)!==r.ph)return"bad";cfg.uid=r.uid;return enter(k,r.name||name,r)}
 if(r&&r.uid!==cfg.uid)return"taken";
 if(mode==="up"){if(r&&r.ph)return"taken";const salt=crypto.randomUUID();await api("PUT","users/"+k,{name,uid:cfg.uid,salt,ph:await hp(pw,salt),pic:r?.pic,status:"idle",total:Math.floor(r?.total||0),dev:cfg.dev,last_seen:{".sv":"timestamp"}});return enter(k,name,r||{})}
 const o=users[old]||{},t=entry(old).total;await api("PUT","users/"+k,{name,uid:cfg.uid,salt:o.salt,ph:o.ph,pic:o.pic,status:"idle",total:Math.floor(t),dev:cfg.dev,last_seen:{".sv":"timestamp"}});
 if(old&&old!==k){groups=await api("GET","groups")||{};await migrate(old,k)}
 return enter(k,name,{total:t})}catch(e){return"err"}}
function auth(m,msg){am=m;if(!$("#nm").open)$("#nm").showModal();$("#tin").classList.toggle("on",m==="in");$("#tup").classList.toggle("on",m==="up");$("#nin").value=cfg.name||$("#nin").value;$("#nmsg").textContent=msg||"";$("#nh").textContent=m==="in"?"Log in with your name tag and password from any device.":"Pick a name tag (2-20 letters, numbers, _ or -) and a password (6+ characters). Accounts unused for 3 months are deleted and the tag becomes free."}
async function boot(){if(!cfg.name)return auth("in");try{const k=cfg.name.toLowerCase(),r=await api("GET","users/"+k);if(r&&r.uid===cfg.uid&&r.ph)return enter(k,cfg.name,r);
 if(r&&r.uid===cfg.uid)auth("up","Set a password so you can log in from anywhere 🔒");else auth(r?"in":"up",r?"Please log in again.":"")}catch(e){banner("Can't reach the server. Retrying…");setTimeout(boot,5000)}}
$("#nm").addEventListener("cancel",e=>e.preventDefault());$("#tin").onclick=()=>auth("in");$("#tup").onclick=()=>auth("up");
$("#nok").onclick=async()=>{const n=$("#nin").value.trim(),p=$("#npw").value,m=$("#nmsg");if(!NAME_RE.test(n))return m.textContent="Name tag: 2-20 letters, numbers, _ or -, with at least one letter.";if(p.length<6)return m.textContent="Password needs 6+ characters.";m.textContent="…";const r=await claim(n,p,am);if(r==="ok"){$("#npw").value="";$("#nm").close()}else m.textContent={taken:"That name tag is taken. If it's yours, use Log in.",nouser:"No account with that name tag.",bad:"Wrong password.",err:"Can't reach the server."}[r]};

/* ---- timer ---- */
function hl(){document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===me.status));document.body.classList.toggle("studying",me.status==="studying");$("#stl").textContent={studying:"studying, you've got this!",break:"break time, sip some tea",away:"away for a bit",idle:"ready when you are"}[me.status]}
function setStatus(n){if(!ready||me.status===n)return;const t=now(),was=me.status;
 if(was==="studying"&&me.since){me.total+=Math.max(0,(t-me.since)/1000);me.since=null}
 if(n==="studying")me.since=Math.floor(t);me.status=n;
 if(n==="studying")beep("start");else if(was==="studying")beep("end");
 push();hl();render()}
setInterval(()=>{if(!ready)return;const s=me.status==="studying"&&me.since?(now()-me.since)/1000:0;$("#sess").textContent=fmt(s);render()},1000);

/* ---- groups ---- */
function renderGroups(){$("#glist").innerHTML=myG().map(([t,g])=>{const own=g.owner===key;return`<div class="card"><b>👭 ${esc(g.name)}</b> <span class="tag" data-copy="${t}" title="Tap to copy">#${t}</span><div>${Object.keys(g.members).map(k=>`<span class="pill">${esc(users[k]?.name||k)}${own&&k!==key?` <a data-ban="${t}|${k}" role="button" aria-label="Ban">✕</a>`:""}</span>`).join("")}</div><div style="margin-top:6px;display:flex;gap:8px"><button data-addall="${t}">💛 Add all as friends</button><button data-leave="${t}">Leave</button></div></div>`}).join("")||`<p class="empty">No groups yet. Create one, or enter a tag to join.</p>`}
async function mkGroup(){const n=$("#gname").value.trim().slice(0,24);if(!n||!ready)return;const t=Math.random().toString(36).slice(2,7).toUpperCase();try{await api("PUT","groups/"+t,{name:n,owner:key,members:{[key]:true}});$("#gname").value="";await poll()}catch(e){onErr(e)}}
async function joinGroup(){const t=$("#gtag").value.trim().replace("#","").toUpperCase();if(!t||!ready)return;try{const g=await api("GET","groups/"+t);if(!g)return banner("No group has that tag.");if((g.banned&&g.banned[key])||(g.bandev&&g.bandev[cfg.dev]))return banner("You can't join this group.");await api("PATCH",`groups/${t}/members`,{[key]:true});$("#gtag").value="";banner("");await poll()}catch(e){onErr(e)}}

/* ---- chat ---- */
const cpath=(s=chatSel)=>s==="general"?"chat/general":s.startsWith("g_")?"chat/"+s:"chat/dm_"+[key,s.slice(3)].sort().join("__");
function fillSel(){const o=[["general","🌍 General"],...myG().map(([t,g])=>["g_"+t,"👭 "+g.name]),...cfg.friends.filter(k=>!cfg.blocked.includes(k)).map(k=>["dm:"+k,"💌 "+(users[k]?.name||k)])];
 if(!o.some(x=>x[0]===chatSel))chatSel="general";$("#csel").innerHTML=o.map(([v,l])=>`<option value="${esc(v)}"${v===chatSel?" selected":""}>${unr[v]&&cfg.nt.dots?(v[0]==="g"?"🔴 ":"🔵 "):""}${esc(l)}</option>`).join("")}
async function loadChat(){if(!ready||$("#v-chat").hidden)return;try{const m=await api("GET",cpath(),undefined,'?orderBy=%22$key%22&limitToLast=60')||{};const last=Object.keys(m).sort().pop();if(last&&!document.hidden&&chatSel!=="general"){cfg.seen??={};cfg.seen[chatSel]=last;unr[chatSel]=0;save();updDots()}const ids=Object.keys(m).sort().filter(i=>!cfg.blocked.includes(m[i].from));const sig=chatSel+ids.join();if(sig===lastMsg)return;lastMsg=sig;const box=$("#msgs");
 box.innerHTML=ids.map(i=>`<div class="m${m[i].from===key?" mine":""}"><small>${esc(m[i].name||m[i].from)}</small>${esc(m[i].text)}</div>`).join("")||`<p class="empty">Nothing here yet. Say hi! 👋</p>`;box.scrollTop=box.scrollHeight}catch(e){onErr(e)}}
async function send(){const t=$("#cin").value.trim().slice(0,500);if(!t||!ready)return;$("#cin").value="";try{await api("POST",cpath(),{from:key,name:cfg.name,text:t,t:{".sv":"timestamp"}});lastMsg="";loadChat()}catch(e){onErr(e)}}
function view(v){document.querySelectorAll("section").forEach(s=>s.hidden=s.id!=="v-"+v);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));if(v==="chat"){fillSel();lastMsg="";loadChat()}if(v==="groups")renderGroups()}

/* ---- settings ---- */
function settings(){$("#dlg").innerHTML=`<h3>Name</h3><div class="add"><input id="s-name" value="${esc(cfg.name||"")}" maxlength="20"><button id="s-nsave">Save</button></div><small id="s-msg"></small>
<h3>Profile picture</h3><input type="file" id="s-pic" accept="image/*" style="width:100%">
<h3>Background</h3><label><input type="checkbox" id="s-bg" ${cfg.bg?"checked":""}> Keep running (keeps the screen awake)</label>
<h3>Notifications</h3><label><input type="checkbox" id="s-dots" ${cfg.nt.dots?"checked":""}> Dots for new messages (🔴 groups, 🔵 DMs)</label><label><input type="checkbox" id="s-pop" ${cfg.nt.pop?"checked":""}> Pop-up notifications when the tab is hidden</label>
<h3>Sounds</h3><label><input type="checkbox" id="s-on" ${cfg.snd.on?"checked":""}> Sounds on</label><label>Volume <input type="range" id="s-vol" min="0" max="1" step=".05" value="${cfg.snd.vol}"></label>${Object.keys(S).map(k=>`<label><input type="checkbox" data-snd="${k}" ${cfg.snd.off.includes(k)?"":"checked"}> ${SL[k]}</label>`).join("")}
<h3>Banned friends</h3>${cfg.blocked.map(k=>`<span class="pill">${esc(users[k]?.name||k)} <a data-unblk="${k}" role="button">undo</a></span>`).join("")||"<small>Nobody.</small>"}
<h3>Your data</h3><div style="display:flex;gap:8px"><button id="s-exp">Export</button><button id="s-del" class="danger">Reset to zero</button><button id="s-out">Log out</button></div>
<div style="margin-top:14px;text-align:right"><button id="s-x">Close</button></div>`;$("#dlg").showModal()}
function pic(f){const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=64;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,64,64);api("PATCH","users/"+key,{pic:c.toDataURL("image/jpeg",.7)}).then(poll).catch(onErr)};im.src=URL.createObjectURL(f)}
async function bg(){try{if(cfg.bg&&"wakeLock"in navigator)wl=await navigator.wakeLock.request("screen");else{wl?.release();wl=null}}catch(e){}}
$("#dlg").addEventListener("change",e=>{const t=e.target;
 if(t.id==="s-pic"&&t.files[0])pic(t.files[0]);
 if(t.id==="s-bg"){cfg.bg=t.checked;bg()}
 if(t.id==="s-on"){cfg.snd.on=t.checked}
 if(t.id==="s-dots"){cfg.nt.dots=t.checked;updDots()}
 if(t.id==="s-pop"){cfg.nt.pop=t.checked;if(t.checked&&window.Notification)Notification.requestPermission()}
 if(t.dataset.snd){const o=cfg.snd.off,k=t.dataset.snd,i=o.indexOf(k);t.checked?i>-1&&o.splice(i,1):i<0&&o.push(k);beep(k)}
 save()});
$("#dlg").addEventListener("input",e=>{if(e.target.id==="s-vol"){cfg.snd.vol=+e.target.value;save();beep("click")}});
$("#dlg").addEventListener("click",async e=>{const t=e.target;
 if(t.id==="s-x")$("#dlg").close();
 if(t.id==="s-nsave"){const n=$("#s-name").value.trim();if(!NAME_RE.test(n))return $("#s-msg").textContent="Use 2-20 letters, numbers, _ or -.";const r=await claim(n,"","ren");$("#s-msg").textContent=r==="ok"?"Saved! Friends will need your new tag.":r==="taken"?"Already taken.":"Can't reach the server."}
 if(t.dataset.unblk){cfg.blocked=cfg.blocked.filter(k=>k!==t.dataset.unblk);save();lastSig="";render();settings()}
 if(t.id==="s-out"&&confirm("Log out on this device?")){cfg.name=null;cfg.uid=crypto.randomUUID();save();location.reload()}
 if(t.id==="s-exp"){const b=new Blob([JSON.stringify({name:cfg.name,total:Math.floor(entry(key).total),friends:cfg.friends,banned:cfg.blocked,groups:myG().map(([t,g])=>({tag:t,name:g.name})),exported:new Date().toISOString()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="study-buddy-data.json";a.click()}
 if(t.id==="s-del"&&confirm("Reset all your study time to zero? This can't be undone.")){me={status:"idle",since:null,total:0};hl();try{await api("PATCH","users/"+key,{total:0,status:"idle",since:null});poll()}catch(x){onErr(x)}}});

/* ---- clicks ---- */
document.addEventListener("click",e=>{const t=e.target,c=t.closest("button,a,.tag");if(c)beep("click");
 if(t.closest("[data-s]"))setStatus(t.closest("[data-s]").dataset.s);
 const v=t.closest("[data-v]");if(v)view(v.dataset.v);
 const ch=t.closest("[data-chip]");if(ch){const id=ch.dataset.chip,s=cfg.sel;if(id==="all")cfg.sel=[];else if(id==="gonly")cfg.sel=myG().map(([t])=>"g:"+t);else if(id==="unhide")cfg.hidden=[];else cfg.sel=s.includes(id)?s.filter(x=>x!==id):[...s,id];save();lastSig="";render()}
 const dm=t.closest("[data-dm]");if(dm){chatSel="dm:"+dm.dataset.dm;view("chat")}
 const rq=t.closest("[data-rq]");if(rq)sendReq(rq.dataset.rq).then(()=>banner("Friend request sent 💌")).catch(onErr);
 const ac=t.closest("[data-acc]");if(ac)accept(ac.dataset.acc).then(poll).catch(onErr);
 const dc=t.closest("[data-dec]");if(dc)api("DELETE",`requests/${key}/${dc.dataset.dec}`).then(poll).catch(onErr);
 const bl=t.closest("[data-blk]");if(bl){const k=bl.dataset.blk;if(confirm(`Ban ${users[k]?.name||k} from your friends? They'll vanish from your list and chats.`)){cfg.blocked.push(k);cfg.friends=cfg.friends.filter(x=>x!==k);save();[`friends/${key}/${k}`,`friends/${k}/${key}`,`requests/${key}/${k}`].forEach(p=>api("DELETE",p).catch(onErr));lastSig="";render()}}
 const cp=t.closest("[data-copy]");if(cp)navigator.clipboard?.writeText(cp.dataset.copy);
 const ba=t.closest("[data-ban]");if(ba){const[g,k]=ba.dataset.ban.split("|");if(confirm("Ban this member from the group?"))Promise.all([api("PATCH",`groups/${g}/banned`,{[k]:true}),api("DELETE",`groups/${g}/members/${k}`),...(users[k]?.dev?[api("PATCH",`groups/${g}/bandev`,{[users[k].dev]:true})]:[])]).then(poll).catch(onErr)}
 const aa=t.closest("[data-addall]");if(aa){Object.keys(groups[aa.dataset.addall].members).filter(k=>k!==key&&!cfg.friends.includes(k)&&!cfg.blocked.includes(k)).forEach(k=>sendReq(k).catch(onErr));banner("Friend requests sent 💌")}
 const lv=t.closest("[data-leave]");if(lv&&confirm("Leave this group?"))api("DELETE",`groups/${lv.dataset.leave}/members/${key}`).then(poll).catch(onErr)});
document.addEventListener("contextmenu",e=>{const r=e.target.closest(".row");if(r&&r.dataset.k!==key){e.preventDefault();cfg.hidden.push(r.dataset.k);save();lastSig="";render()}});
$("#gear").onclick=settings;$("#gmk").onclick=mkGroup;$("#gjoin").onclick=joinGroup;$("#csend").onclick=send;
$("#cin").onkeydown=e=>{if(e.key==="Enter")send()};$("#csel").onchange=e=>{chatSel=e.target.value;lastMsg="";loadChat()};
async function addFriend(){const k=$("#fin").value.trim().toLowerCase();$("#fin").value="";if(!k)return;if(!NAME_RE.test(k)||k===key||cfg.friends.includes(k)||cfg.blocked.includes(k))return banner("That name tag is invalid, already a friend, or banned.");let m="";try{if(!await api("GET",`users/${k}/name`))return banner("Nobody has that name tag.");const acc=!!reqs[k];await sendReq(k);m=acc?"":"Friend request sent 💌 They'll see it on their Home screen."}catch(e){return onErr(e)}await poll();banner(m)}
$("#fadd").onclick=addFriend;$("#fin").onkeydown=e=>{if(e.key==="Enter")addFriend()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){bg();push();poll()}});
addEventListener("pagehide",()=>{if(!ready)return;let t=me.total;if(me.status==="studying"&&me.since)t+=(now()-me.since)/1000;fetch(`${DB}/users/${key}.json`,{method:"PATCH",keepalive:true,body:JSON.stringify({status:"offline",since:null,total:Math.floor(t),last_seen:{".sv":"timestamp"}})})});
boot();
</script></body></html>
