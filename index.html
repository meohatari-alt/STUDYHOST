body{margin:auto;height:100%;max-width:480px;display:flex;flex-direction:column;font:500 16px/1.4 Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

[hidden]{display:none!important}

#mascot{display:inline-block}

main{flex:1;overflow:auto;padding:8px 14px}
#timer{background:var(--but);border:2.5px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);text-align:center;padding:14px 8px 10px;margin:6px 0 14px}

.chip{padding:3px 11px;font-size:14px;box-shadow:0 2px 0 var(--ink)}

.row{display:flex;align-items:center;gap:8px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:7px 10px;margin-bottom:8px}
.row.me{background:var(--me)}
.rk{width:18px;text-align:center;opacity:.6}
.av{width:42px;height:42px;border-radius:50%;border:4px solid;display:grid;place-items:center;font-size:22px;overflow:hidden;background:var(--paper);flex:none}

.nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.nm b,.nm small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{opacity:.7}
.t{font-variant-numeric:tabular-nums;font-weight:600}
.mini{padding:2px 6px;box-shadow:0 2px 0 var(--ink);font-size:14px}
.add{display:flex;gap:8px;margin:10px 0}
.add input{flex:1}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.pill{display:inline-block;background:var(--lav);border:2px solid var(--ink);border-radius:12px;padding:0 8px;margin:3px 3px 3px 0;font-size:14px}
.pill a{cursor:pointer;color:var(--err)}
.tag{background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:0 6px;font-size:13px;cursor:pointer}
.empty,#hint{opacity:.7;text-align:center;font-size:14px}
#banner{margin:0;padding:0 16px;color:var(--err);text-align:center;min-height:0}
#msgs{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.m{max-width:80%;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:4px 10px;align-self:flex-start;overflow-wrap:anywhere}
.m.mine{align-self:flex-end;background:var(--pink)}
.m small{display:block;opacity:.65;font-size:12px}
nav{display:flex;gap:8px;padding:10px 14px 12px}
nav button{flex:1}
nav button.on{background:var(--pink)}
dialog{border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);background:var(--paper);color:var(--ink);width:min(92vw,420px);max-height:88vh}
dialog::backdrop{background:#3d264766}
dialog h3{margin:14px 0 6px}
dialog label{display:flex;align-items:center;gap:8px;margin:4px 0}
.danger{background:var(--dng)}
.dot{display:inline-block;min-width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-inline-start:4px;vertical-align:middle;font-size:9px;line-height:8px}.dot.r{background:#ff4d6d}.dot.b{background:#4d9bff}.dot.y{background:var(--but);padding:0 2px}

#modes{justify-content:center}
.row small span{margin-inline-start:4px}.lk{margin-inline-start:4px}

#help i{width:20px;height:20px;border-radius:50%;background:var(--lav);border:2px solid var(--ink);display:grid;place-items:center;font:700 12px/1 Georgia,serif}
html[lang=ar] body{font-family:Cairo,Fredoka,ui-rounded,system-ui,sans-serif}

function tx(n){
 if(n.nodeType===3){const v=n.nodeValue,o=n._t===v?n._o:v,k=o.trim(),r=T(k),out=r===k?o:o.replace(k,()=>r);n._o=o;n._t=out;if(out!==v)n.nodeValue=out;return}
 if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.tagName))return;
 for(const a of AT){const v=n.getAttribute(a);if(v==null)continue;const c=n._oa&&n._oa[a],o=c&&c[1]===v?c[0]:v,out=T(o);(n._oa??={})[a]=[o,out];if(out!==v)n.setAttribute(a,out)}

const dk=x=>{x=new Date(x);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,0)}-${String(x.getDate()).padStart(2,0)}`};
const pk=(p,n)=>{const x=new Date(n);x.setHours(0,0,0,0);if(p==="week")x.setDate(x.getDate()-(x.getDay()+1)%7);if(p==="month")x.setDate(1);return dk(x)};
const sum=(d,p,n)=>{const s=pk(p,n);let t=0;for(const k in d)if(k>=s)t+=d[k];return t};
function split(a,b){const o={};let c=a,i=0;while(c<b&&i++<70){const x=new Date(c);x.setHours(24,0,0,0);const e=Math.min(b,+x);o[dk(c)]=(o[dk(c)]||0)+(e-c)/1000;c=e}return o}
const addDays=(d,s)=>{for(const k in s)d[k]=Math.round((d[k]||0)+s[k]);const c=dk(Date.now()-62*864e5);for(const k in d)if(k<c)delete d[k];return d};

const pd=ph=>(ph==="focus"?cfg.pm.f:ph==="long"?cfg.pm.l:cfg.pm.s)*60;
function pomTick(){const p=me.pom;if(cfg.pm.mode!=="pom"||!p||me.status!=="studying"&&me.status!=="break")return;
 for(let i=0;i<20;i++){const e=p.s+pd(p.ph)*1000;if(now()<e)return;
  if(p.ph==="focus"){p.n++;p.ph=p.n%cfg.pm.c?"short":"long";p.s=e;setStatus("break",e,1)}
  else if(cfg.pm.auto){p.ph="focus";p.s=e;setStatus("studying",e,1)}
  else{me.pom=null;setStatus("idle",e,1);return}}}
function showTimer(){let s=me.status==="studying"&&me.since?(now()-me.since)/1000:0,l=null;
 if(cfg.pm.mode==="pom"){pomTick();const p=me.pom;
  if(p&&(me.status==="studying"||me.status==="break")){s=Math.max(0,pd(p.ph)-(now()-p.s)/1000);l=p.ph==="focus"?T("🍅 Focus {a}/{b}").replace("{a}",p.n%cfg.pm.c+1).replace("{b}",cfg.pm.c):p.ph==="long"?T("🌴 Long break"):T("☕ Short break")}

 $("#sess").textContent=fmt(s);if(l)$("#stl").textContent=l}

function remap(o,n){for(const L of["muted","hidden"]){const a=cfg[L];if(a.includes(o)){if(!a.includes(n))a.push(n);cfg[L]=a.filter(x=>x!==o)}}
 if(cfg.blocked.includes(o)&&!cfg.blocked.includes(n))cfg.blocked.push(n);

function checkRen(){cfg.renT??=now();const mem=new Set(myG().flatMap(([t,g])=>Object.keys(g.members)));

<div style="margin-top:14px;text-align:end"><button id="s-x">Close</button></div>`;$("#s-mode").value=cfg.mode;$("#s-sm").value=cfg.sm;$("#s-lang").value=cfg.lang;$("#dlg").showModal()}
function pic(f){const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=64;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,64,64);api("PATCH","users/"+key,{pic:c.toDataURL("image/jpeg",.7)}).then(poll).catch(onErr)};im.src=URL.createObjectURL(f)}
async function bg(){try{if(cfg.bg&&"wakeLock"in navigator)wl=await navigator.wakeLock.request("screen");else{wl?.release();wl=null}}catch(e){}}
$("#dlg").addEventListener("change",e=>{const t=e.target;
 if(t.id==="s-pic"&&t.files[0])pic(t.files[0]);
 if(t.id==="s-bg"){cfg.bg=t.checked;bg()}
 if(t.id==="s-on"){cfg.snd.on=t.checked}
 if(t.id==="s-mode"){cfg.mode=t.value;applyLook()}
 if(t.id==="s-lang"){cfg.lang=t.value;applyLang();lastSig="";render()}
 if(t.id==="s-dots"){cfg.nt.dots=t.checked;updDots()}
 if(t.id==="s-ren")cfg.nt.ren=t.checked;
 if(t.id==="s-pop"){cfg.nt.pop=t.checked;if(t.checked&&window.Notification)Notification.requestPermission()}
 if(t.id==="s-tray"){cfg.nt.tray=t.checked;if(t.checked&&window.Notification&&Notification.permission==="default")Notification.requestPermission();trayUpdate(1)}
 if(t.id==="s-sm"){cfg.sm=t.value;applySmall()}
 if(t.dataset.pm){cfg.pm[t.dataset.pm]=t.type==="checkbox"?t.checked:Math.max(1,Math.min(180,Math.round(+t.value)||1))}
 if(t.dataset.snd){const o=cfg.snd.off,k=t.dataset.snd,i=o.indexOf(k);t.checked?i>-1&&o.splice(i,1):i<0&&o.push(k);beep(k)}
 save()});
$("#dlg").addEventListener("input",e=>{if(e.target.id==="s-vol"){cfg.snd.vol=+e.target.value;save();beep("click")}});
$("#dlg").addEventListener("click",async e=>{const t=e.target;
 if(t.id==="s-x")$("#dlg").close();
 if(t.dataset.th){cfg.theme=t.dataset.th;save();applyLook();document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b===t))}
 if(t.dataset.unmute){cfg.muted=cfg.muted.filter(k=>k!==t.dataset.unmute);save();lastSig="";render();settings()}
 if(t.id==="s-nsave"){const n=$("#s-name").value.trim();if(!NAME_RE.test(n))return $("#s-msg").textContent="Use 2-20 letters, numbers, _ or -.";const r=await claim(n,"","ren");$("#s-msg").textContent=r==="ok"?"Saved! Your friends and groups came with you, and they'll be told.":r==="taken"?"Already taken.":"Can't reach the server."}
 if(t.dataset.unblk){cfg.blocked=cfg.blocked.filter(k=>k!==t.dataset.unblk);save();lastSig="";render();settings()}
 if(t.id==="s-out"&&confirm(T("Log out on this device?"))){cfg.name=null;cfg.loc=null;cfg.dirty=0;cfg.uid=crypto.randomUUID();save();location.reload()}
 if(t.id==="s-del"&&confirm(T("Reset all your study time to zero? This can't be undone."))){me={status:"idle",since:null,total:0,days:{}};hl();saveLoc();try{await api("PATCH","users/"+key,{total:0,days:null,status:"idle",since:null});poll()}catch(x){onErr(x)}}});

/* ---- clicks ---- */
document.addEventListener("click",e=>{const t=e.target,c=t.closest("button,a,.tag");if(c)beep("click");
 if(t.closest("[data-s]"))setStatus(t.closest("[data-s]").dataset.s);
 const v=t.closest("[data-v]");if(v)view(v.dataset.v);
 const ch=t.closest("[data-chip]");if(ch){const id=ch.dataset.chip,s=cfg.sel;if(id==="all")cfg.sel=[];else if(id==="gonly")cfg.sel=myG().map(([t])=>"g:"+t);else if(id==="unhide")cfg.hidden=[];else cfg.sel=s.includes(id)?s.filter(x=>x!==id):[...s,id];save();lastSig="";render()}
 const dm=t.closest("[data-dm]");if(dm){chatSel="dm:"+dm.dataset.dm;view("chat")}
 const rq=t.closest("[data-rq]");if(rq)sendReq(rq.dataset.rq).then(()=>banner("Friend request sent 💌")).catch(onErr);
 const ac=t.closest("[data-acc]");if(ac)accept(ac.dataset.acc).then(poll).catch(onErr);
 const dc=t.closest("[data-dec]");if(dc)api("DELETE",`requests/${key}/${dc.dataset.dec}`).then(poll).catch(onErr);
 const bl=t.closest("[data-blk]");if(bl){const k=bl.dataset.blk;if(confirm(T("Block {n}? They'll vanish from your friends, list and chats.").replace("{n}",users[k]?.name||k))){cfg.blocked.push(k);cfg.friends=cfg.friends.filter(x=>x!==k);save();[`friends/${key}/${k}`,`friends/${k}/${key}`,`requests/${key}/${k}`].forEach(p=>api("DELETE",p).catch(onErr));lastSig="";render();$("#dlg").close()}}
 const cp=t.closest("[data-copy]");if(cp){navigator.clipboard?.writeText(cp.dataset.copy);banner("Tag copied 📋")}
 const lk=t.closest("[data-link]");if(lk){const u=location.href.split(/[?#]/)[0]+"?join="+lk.dataset.link;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>banner("Invite link copied 🔗")).catch(()=>prompt(T("Copy this invite link:"),u))}
 const mo=t.closest("[data-more]");if(mo)person(mo.dataset.more);
 const mu=t.closest("[data-mute]");if(mu){const k=mu.dataset.mute,i=cfg.muted.indexOf(k);i<0?cfg.muted.push(k):cfg.muted.splice(i,1);save();lastSig="";render();$("#dlg").close()}
 const hd=t.closest("[data-hide]");if(hd){cfg.hidden.push(hd.dataset.hide);save();lastSig="";render();$("#dlg").close()}
 const md=t.closest("[data-mode]");if(md){if(me.status!=="idle")setStatus("idle");cfg.pm.mode=md.dataset.mode;me.pom=null;save();renderModes();hl();showTimer()}
 const rn=t.closest("[data-rn]");if(rn){cfg.rn.splice(+rn.dataset.rn,1);save();lastReq="";renderReqs()}
 const pr=t.closest("[data-per]");if(pr){cfg.per=pr.dataset.per;save();lastSig="";render()}
 const ba=t.closest("[data-ban]");if(ba){const[g,k]=ba.dataset.ban.split("|");if(confirm(T("Ban this member from the group?")))Promise.all([api("PATCH",`groups/${g}/banned`,{[k]:true}),api("DELETE",`groups/${g}/members/${k}`),...(users[k]?.dev?[api("PATCH",`groups/${g}/bandev`,{[users[k].dev]:true})]:[])]).then(poll).catch(onErr)}
 const aa=t.closest("[data-addall]");if(aa){Object.keys(groups[aa.dataset.addall].members).filter(k=>k!==key&&!cfg.friends.includes(k)&&!cfg.blocked.includes(k)).forEach(k=>sendReq(k).catch(onErr));banner("Friend requests sent 💌")}
 const lv=t.closest("[data-leave]");if(lv&&confirm(T("Leave this group?")))api("DELETE",`groups/${lv.dataset.leave}/members/${key}`).then(poll).catch(onErr)});
document.addEventListener("contextmenu",e=>{const r=e.target.closest(".row");if(r&&r.dataset.k!==key){e.preventDefault();cfg.hidden.push(r.dataset.k);save();lastSig="";render()}});
if(!document.documentElement.requestFullscreen)$("#fs").hidden=true;$("#fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$("#gear").onclick=settings;$("#pen").onclick=pomEdit;$("#help").onclick=help;$("#gmk").onclick=mkGroup;$("#gjoin").onclick=()=>joinGroup();$("#csend").onclick=send;
$("#cin").onkeydown=e=>{if(e.key==="Enter")send()};$("#csel").onchange=e=>{chatSel=e.target.value;lastMsg="";loadChat()};
async function addFriend(){const k=$("#fin").value.trim().toLowerCase();$("#fin").value="";if(!k)return;if(!NAME_RE.test(k)||k===key||cfg.friends.includes(k)||cfg.blocked.includes(k))return banner("That name tag is invalid, already a friend, or blocked.");let m="";try{if(!await api("GET",`users/${k}/name`))return banner("Nobody has that name tag.");const acc=!!reqs[k];await sendReq(k);m=acc?"":"Friend request sent 💌 They'll see it on their Home screen."}catch(e){return onErr(e)}await poll();banner(m)}
$("#fadd").onclick=addFriend;$("#fin").onkeydown=e=>{if(e.key==="Enter")addFriend()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){bg();push();poll()}});
addEventListener("pagehide",()=>{if(!ready)return;saveLoc();let t=me.total;const d={...me.days};if(me.status==="studying"&&me.since){t+=(now()-me.since)/1000;addDays(d,split(me.since,now()))}fetch(`${DB}/users/${key}.json`,{method:"PATCH",keepalive:true,body:JSON.stringify({status:"offline",since:null,total:Math.floor(t),days:d,last_seen:{".sv":"timestamp"}})})});
addEventListener("online",()=>{push();poll()});
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
let ip=null;const sa=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(!sa())document.documentElement.dataset.sa=1});
addEventListener("appinstalled",()=>{ip=null;delete document.documentElement.dataset.sa});
$("#inst").onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice.catch(()=>0);ip=null;delete document.documentElement.dataset.sa};
applySmall();boot();
</script></body></html>
